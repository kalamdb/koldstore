[package]
name = "koldstore-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.cargo-machete]
# Feature-unifies rustls with object_store's HTTP stack; not imported directly.
ignored = ["reqwest"]

[features]
default = ["s3", "gcs", "azure"]
# Shared HTTP + ring crypto for cloud backends. Avoids `object_store/{aws,gcp,azure}`
# (those pull aws-lc via reqwest/rustls) and native-tls (OpenSSL), both of which
# bloat or conflict inside the PostgreSQL backend process.
cloud-http = [
    "object_store/reqwest",
    "object_store/ring",
    "dep:reqwest",
    "dep:rustls",
]
# S3/MinIO via object_store aws-base + rustls (ring provider) + ring SigV4.
s3 = ["cloud-http", "object_store/aws-base"]
# GCS via object_store gcp-base + rustls (ring) for service-account signing.
gcs = ["cloud-http", "object_store/gcp-base"]
# Azure Blob via object_store azure-base + rustls (ring).
azure = ["cloud-http", "object_store/azure-base"]

[dependencies]
bytes.workspace = true
futures-util.workspace = true
koldstore-common.workspace = true
# Cloud backends (`aws-base` / `gcp-base` / `azure-base` + HTTP / signing) are
# opt-in via the `s3` / `gcs` / `azure` features.
object_store = { workspace = true, features = ["fs"] }
# Feature-unified with object_store's reqwest; rustls without bundled aws-lc.
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros"] }
uuid.workspace = true

[dev-dependencies]
koldstore-common.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros"] }

[lints]
workspace = true
