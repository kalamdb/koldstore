# Show proof-of-work output for the full lifecycle scenario test during suite runs.
[[profile.default.overrides]]
filter = 'test(full_lifecycle_wide_table_migrates_flushes_in_batches_and_queries_all_rows)'
success-output = "immediate"

[[profile.default.overrides]]
filter = 'package(stress)'
success-output = "immediate"
# Stress soaks are intentionally long; allow up to ~3h wall before terminate.
slow-timeout = { period = "300s", terminate-after = 36, grace-period = "30s" }

# Postmaster-killing crash tests: at most one at a time (SIGKILL / immediate
# restart takes down the whole shared pgrx cluster). Fixtures also take a
# cluster flock; this group avoids two killers racing each other.
[test-groups]
pg-cluster-killer = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(crash::flush_executor_kill) | test(crash::flush_long_crash) | test(crash::postmaster_restart)'
test-group = 'pg-cluster-killer'

# CI profile: JUnit XML for GitHub Actions test-result publishing.
[profile.ci]
retries = 0

[[profile.ci.overrides]]
filter = 'test(full_lifecycle_wide_table_migrates_flushes_in_batches_and_queries_all_rows)'
success-output = "immediate"

[[profile.ci.overrides]]
filter = 'package(stress)'
success-output = "immediate"
slow-timeout = { period = "300s", terminate-after = 36, grace-period = "30s" }

[[profile.ci.overrides]]
filter = 'test(crash::flush_executor_kill) | test(crash::flush_long_crash) | test(crash::postmaster_restart)'
test-group = 'pg-cluster-killer'

[profile.ci.junit]
path = "junit.xml"
report-name = "koldstore-ci"
store-failure-output = true
store-success-output = false

