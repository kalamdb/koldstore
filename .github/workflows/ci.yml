name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      pg_version:
        description: PostgreSQL version filter
        type: choice
        required: true
        default: All
        options:
          - All
          - "15"
          - "16"
          - "17"
          - "18"

env:
  CARGO_TERM_COLOR: always
  PGRX_VERSION: "0.19.1"

# Needed so EnricoMi can publish check runs + PR comments from JUnit.
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  rust:
    name: fmt / clippy / unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-nextest --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - name: Unit tests (nextest)
        run: |
          cargo nextest run --profile ci --workspace --no-default-features \
            --exclude e2e --exclude examples --exclude storage-comparison \
            --exclude pg-koldstore-benchmarks --exclude koldstore-memory-tests --exclude stress
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: (!cancelled())
        with:
          check_name: Unit tests
          files: target/nextest/ci/junit.xml
          comment_mode: failures
      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-unit
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn

  pgrx-test:
    name: "pg_test (PG ${{ matrix.pg }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.pg_version != 'All' && format('[{0}]', inputs.pg_version) || '[15,16,17,18]') }}
    env:
      PG_VER: ${{ matrix.pg }}
      PGRX_PG_CONFIG: /usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2

      - name: Install PostgreSQL ${{ matrix.pg }} development packages
        run: |
          bash scripts/ci/install-pgdg-dev.sh "${PG_VER}"

      - name: Install cargo-pgrx and cargo-nextest
        run: |
          cargo install cargo-pgrx --version ${PGRX_VERSION} --locked
          cargo install cargo-nextest --locked

      - name: Initialize pgrx for PostgreSQL ${{ matrix.pg }}
        run: cargo pgrx init --pg${PG_VER} "${PGRX_PG_CONFIG}"

      # pgrx-tests installs into pg_config --sharedir/--pkglibdir. Apt packages
      # put those under /usr, so the runner needs write access.
      - name: Allow non-root extension install into system PostgreSQL
        run: |
          share_ext="$("${PGRX_PG_CONFIG}" --sharedir)/extension"
          pkglib="$("${PGRX_PG_CONFIG}" --pkglibdir)"
          sudo mkdir -p "${share_ext}" "${pkglib}"
          sudo chmod a+w "${share_ext}" "${pkglib}"

      # Serial threads are required: #[pg_test] shares one DB and one async logical
      # slot; parallel flush fences race on PostgreSQL's nowait slot acquire.
      # Use nextest --test-threads 1 (same as scripts/run-all-tests.sh), not
      # `cargo pgrx test`, which defaults to parallel libtest threads.
      - name: "Run pg_test suite (nextest, serial)"
        run: |
          features="pg${PG_VER} pg_test s3"
          manifest="${GITHUB_WORKSPACE}/crates/pg_koldstore/Cargo.toml"
          CARGO_TARGET_DIR="${GITHUB_WORKSPACE}/target" \
            PGRX_FEATURES="${features}" \
            PGRX_NO_DEFAULT_FEATURES=true \
            PGRX_ALL_FEATURES=false \
            PGRX_BUILD_PROFILE=dev \
            PGRX_NO_SCHEMA=false \
            PGRX_MANIFEST_PATH="${manifest}" \
            cargo nextest run \
              --profile ci \
              --manifest-path "${manifest}" \
              --features "${features}" \
              --no-default-features \
              --test-threads 1
        env:
          RUST_BACKTRACE: "1"
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: (!cancelled())
        with:
          check_name: "pg_test (PG ${{ matrix.pg }})"
          files: target/nextest/ci/junit.xml
          comment_mode: failures
      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-pg-test-pg${{ matrix.pg }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn

  e2e:
    name: E2E (PG ${{ matrix.pg }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        pg: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.pg_version != 'All' && format('[{0}]', inputs.pg_version) || '[15,16,17,18]') }}
    env:
      PG_VER: ${{ matrix.pg }}
      KOLDSTORE_E2E_PGVERSION: ${{ matrix.pg }}
      KOLDSTORE_E2E_PGPORT: ${{ format('288{0}', matrix.pg) }}
      KOLDSTORE_E2E_PGHOST: 127.0.0.1
      KOLDSTORE_E2E_PGDATABASE: koldstore_pgrx_e2e
      KOLDSTORE_E2E_WAIT_FOR_STARTUP: "1"
      KOLDSTORE_E2E_THREADS: "4"
      KOLDSTORE_E2E_NEXTEST_PROFILE: ci
      PGRX_PG_CONFIG: /usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Install PostgreSQL ${{ matrix.pg }} development packages
        run: |
          bash scripts/ci/install-pgdg-dev.sh "${PG_VER}"

      - name: Install cargo-pgrx
        run: cargo install cargo-pgrx --version ${PGRX_VERSION} --locked

      - name: Initialize pgrx for PostgreSQL ${{ matrix.pg }}
        run: cargo pgrx init --pg${PG_VER} "${PGRX_PG_CONFIG}"

      - name: Start MinIO for S3-backed E2E
        run: bash scripts/ci/start-minio.sh

      - name: Run E2E suite
        run: bash scripts/run-pg-e2e.sh "${PG_VER}"
        env:
          KOLDSTORE_PGRX_INSTALL_SUDO: "1"
          KOLDSTORE_MINIO: "1"
          KOLDSTORE_MINIO_ENDPOINT: http://127.0.0.1:9000
          KOLDSTORE_MINIO_ACCESS_KEY: minioadmin
          KOLDSTORE_MINIO_SECRET_KEY: minioadmin
          KOLDSTORE_MINIO_BUCKET: koldstore-test
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: (!cancelled())
        with:
          check_name: "E2E (PG ${{ matrix.pg }})"
          files: target/nextest/ci/junit.xml
          comment_mode: failures
      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-e2e-pg${{ matrix.pg }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn

  pgrx-integration:
    name: Examples + SQL (PG ${{ matrix.pg }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        pg: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.pg_version != 'All' && format('[{0}]', inputs.pg_version) || '[15,16,17,18]') }}
    env:
      PG_VER: ${{ matrix.pg }}
      KOLDSTORE_E2E_PGVERSION: ${{ matrix.pg }}
      KOLDSTORE_E2E_PGPORT: ${{ format('288{0}', matrix.pg) }}
      KOLDSTORE_E2E_PGHOST: 127.0.0.1
      KOLDSTORE_E2E_PGDATABASE: koldstore_pgrx_e2e
      KOLDSTORE_E2E_WAIT_FOR_STARTUP: "1"
      KOLDSTORE_EXAMPLE_PGVERSION: ${{ matrix.pg }}
      PGRX_PG_CONFIG: /usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config
      # Keep example scenarios CI-friendly while still exercising flush + concurrency.
      KOLDSTORE_EXAMPLE_ROWS: "2000"
      KOLDSTORE_EXAMPLE_CLIENTS: "4"
      KOLDSTORE_EXAMPLE_SCOPES: "8"
      KOLDSTORE_EXAMPLE_TIMEOUT_SECS: "600"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Install PostgreSQL ${{ matrix.pg }} development packages
        run: |
          bash scripts/ci/install-pgdg-dev.sh "${PG_VER}"

      - name: Install cargo-pgrx
        run: cargo install cargo-pgrx --version ${PGRX_VERSION} --locked

      - name: Initialize pgrx for PostgreSQL ${{ matrix.pg }}
        run: cargo pgrx init --pg${PG_VER} "${PGRX_PG_CONFIG}"

      - name: Compile pg_koldstore for PostgreSQL ${{ matrix.pg }}
        run: cargo clippy -p pg_koldstore --all-targets --no-default-features --features pg${PG_VER},pg_test,s3 -- -D warnings

      - name: Run example scenarios
        run: bash scripts/run-examples.sh
        env:
          KOLDSTORE_PGRX_INSTALL_SUDO: "1"

      - name: Run KoldStore SQL regression
        run: bash scripts/run-sql-regression.sh "${PG_VER}"
        env:
          KOLDSTORE_PGRX_INSTALL_SUDO: "1"

  # Dedicated PG16 storage bench: pg and async sides on separate runners so
  # each can wipe its own ~/.pgrx without serializing. Report job compares
  # against the previous successful CI artifacts and posts one sticky PR comment.
  storage-bench:
    name: "Storage bench (PG 16, ${{ matrix.side }})"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Skip when workflow_dispatch filtered to a non-16 major.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.pg_version != 'All' && inputs.pg_version != '16') }}
    strategy:
      fail-fast: false
      matrix:
        side: [pg, async]
    env:
      PG_VER: "16"
      KOLDSTORE_E2E_PGVERSION: "16"
      KOLDSTORE_E2E_PGPORT: "28816"
      KOLDSTORE_E2E_PGHOST: 127.0.0.1
      KOLDSTORE_E2E_PGDATABASE: koldstore_pgrx_e2e
      KOLDSTORE_E2E_WAIT_FOR_STARTUP: "1"
      PGRX_PG_CONFIG: /usr/lib/postgresql/16/bin/pg_config
      KOLDSTORE_STORAGE_ROWS: "10000"
      KOLDSTORE_STORAGE_HOT_LIMIT: "2000"
      KOLDSTORE_STORAGE_DML_SAMPLE: "1000"
      KOLDSTORE_STORAGE_WARMUP_ROWS: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Install PostgreSQL 16 development packages
        run: bash scripts/ci/install-pgdg-dev.sh 16

      - name: Install cargo-pgrx
        run: cargo install cargo-pgrx --version ${PGRX_VERSION} --locked

      - name: Initialize pgrx for PostgreSQL 16
        run: cargo pgrx init --pg16 "${PGRX_PG_CONFIG}"

      - name: Run storage comparison (${{ matrix.side }})
        run: |
          mkdir -p ci-artifacts/storage-bench
          bash scripts/run-storage-comparison.sh \
            --side "${{ matrix.side }}" \
            --pg-version 16 \
            --rows 10000 \
            --hot-limit 2000 \
            --dml-sample 1000 \
            --warmup-rows 0 \
            --write-json-dir ci-artifacts/storage-bench
        env:
          KOLDSTORE_PGRX_INSTALL_SUDO: "1"

      - name: Upload storage-bench JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: storage-bench-${{ matrix.side }}
          path: ci-artifacts/storage-bench/${{ matrix.side }}.json
          if-no-files-found: error

  storage-report:
    name: Storage bench report
    runs-on: ubuntu-latest
    needs: storage-bench
    if: ${{ always() && !cancelled() && needs.storage-bench.result != 'skipped' && !(github.event_name == 'workflow_dispatch' && inputs.pg_version != 'All' && inputs.pg_version != '16') }}
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Download current storage-bench artifacts
        uses: actions/download-artifact@v8
        with:
          name: storage-bench-pg
          path: current-storage-bench/pg

      - name: Download current storage-bench async artifact
        uses: actions/download-artifact@v8
        with:
          name: storage-bench-async
          path: current-storage-bench/async

      - name: Resolve base branch and download baseline artifacts
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p baseline-storage-bench
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_BRANCH="${{ github.base_ref }}"
          else
            BASE_BRANCH="${{ github.ref_name }}"
          fi
          echo "base_branch=${BASE_BRANCH}" >> "$GITHUB_OUTPUT"

          # Latest successful CI run on the base branch that is not this run.
          RUN_JSON="$(
            gh run list \
              --workflow ci.yml \
              --branch "${BASE_BRANCH}" \
              --status success \
              --limit 20 \
              --json databaseId,headSha \
              --jq "map(select(.databaseId != ${{ github.run_id }})) | .[0] // {}"
          )"
          RUN_ID="$(python3 -c "import json,sys; d=json.loads(sys.argv[1] or '{}'); print(d.get('databaseId') or '')" "${RUN_JSON}")"
          BASE_SHA="$(python3 -c "import json,sys; d=json.loads(sys.argv[1] or '{}'); print(d.get('headSha') or '')" "${RUN_JSON}")"
          echo "base_run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "base_sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"

          if [[ -z "${RUN_ID}" ]]; then
            echo "No prior successful CI run on ${BASE_BRANCH}; continuing without baseline."
            exit 0
          fi

          echo "Downloading storage-bench artifacts from run ${RUN_ID} (${BASE_SHA})"
          for side in pg async; do
            if gh run download "${RUN_ID}" \
                --name "storage-bench-${side}" \
                --dir "baseline-storage-bench/${side}" 2>/dev/null; then
              echo "downloaded storage-bench-${side}"
            else
              echo "baseline artifact storage-bench-${side} missing (first run after this feature)"
            fi
          done

      - name: Locate JSON inputs
        id: paths
        run: |
          set -euo pipefail
          find current-storage-bench baseline-storage-bench -type f -name '*.json' -print || true

          find_json() {
            local root="$1"
            local side="$2"
            local hit
            hit="$(find "${root}" -type f \( -path "*/storage-bench-${side}/*" -o -path "*/${side}/*" \) -name "${side}.json" 2>/dev/null | head -n 1 || true)"
            if [[ -z "${hit}" ]]; then
              hit="$(find "${root}" -type f -name "${side}.json" 2>/dev/null | head -n 1 || true)"
            fi
            echo "${hit}"
          }

          CURRENT_PG="$(find_json current-storage-bench pg)"
          CURRENT_ASYNC="$(find_json current-storage-bench async)"
          BASE_PG="$(find_json baseline-storage-bench pg)"
          BASE_ASYNC="$(find_json baseline-storage-bench async)"

          echo "current_pg=${CURRENT_PG}" >> "$GITHUB_OUTPUT"
          echo "current_async=${CURRENT_ASYNC}" >> "$GITHUB_OUTPUT"
          echo "base_pg=${BASE_PG}" >> "$GITHUB_OUTPUT"
          echo "base_async=${BASE_ASYNC}" >> "$GITHUB_OUTPUT"

          if [[ -z "${CURRENT_PG}" || -z "${CURRENT_ASYNC}" ]]; then
            echo "::error::Missing current storage-bench JSON (pg=${CURRENT_PG:-none} async=${CURRENT_ASYNC:-none})"
            exit 1
          fi

      - name: Compare base vs current
        run: |
          set -euo pipefail
          mkdir -p target/storage-bench-report
          ARGS=(
            --current-pg "${{ steps.paths.outputs.current_pg }}"
            --current-async "${{ steps.paths.outputs.current_async }}"
            --base-branch "${{ steps.baseline.outputs.base_branch }}"
            --base-sha "${{ steps.baseline.outputs.base_sha }}"
            --current-sha "${{ github.sha }}"
            --html-out target/storage-bench-report/report.html
            --md-out target/storage-bench-report/comment.md
          )
          if [[ -n "${{ steps.paths.outputs.base_pg }}" ]]; then
            ARGS+=(--base-pg "${{ steps.paths.outputs.base_pg }}")
          fi
          if [[ -n "${{ steps.paths.outputs.base_async }}" ]]; then
            ARGS+=(--base-async "${{ steps.paths.outputs.base_async }}")
          fi
          python3 scripts/ci/compare-storage-bench.py "${ARGS[@]}"
          cat target/storage-bench-report/comment.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: storage-ci-report
          path: |
            target/storage-bench-report/report.html
            target/storage-bench-report/comment.md
          if-no-files-found: warn

      - name: Post sticky PR comment
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/post-storage-bench-comment.sh target/storage-bench-report/comment.md

  memory:
    name: memory checks
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PG_VER: 16
      KOLDSTORE_E2E_PGVERSION: 16
      KOLDSTORE_E2E_PGPORT: 28816
      KOLDSTORE_E2E_PGHOST: 127.0.0.1
      KOLDSTORE_E2E_PGDATABASE: koldstore_pgrx_e2e
      KOLDSTORE_E2E_WAIT_FOR_STARTUP: "1"
      KOLDSTORE_MEMORY_PG_VERSION: "16"
      PGRX_PG_CONFIG: /usr/lib/postgresql/16/bin/pg_config
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Install PostgreSQL 16 development packages
        run: |
          bash scripts/ci/install-pgdg-dev.sh 16

      - name: Install cargo-pgrx
        run: cargo install cargo-pgrx --version ${PGRX_VERSION} --locked

      - name: Initialize pgrx for PostgreSQL 16
        run: cargo pgrx init --pg16 "${PGRX_PG_CONFIG}"

      - name: Start MinIO for S3-backed memory E2E
        run: bash scripts/ci/start-minio.sh

      - name: Run memory checks
        run: tests/memory/run_memory_checks.sh
        env:
          KOLDSTORE_PGRX_INSTALL_SUDO: "1"
          KOLDSTORE_MINIO: "1"
          KOLDSTORE_MINIO_ENDPOINT: http://127.0.0.1:9000
          KOLDSTORE_MINIO_ACCESS_KEY: minioadmin
          KOLDSTORE_MINIO_SECRET_KEY: minioadmin
          KOLDSTORE_MINIO_BUCKET: koldstore-test
