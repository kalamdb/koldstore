name: weekly-hammerdb

# Selective-manage TPROC-C: build → manage HISTORY → timed run → flush →
# EXPLAIN proof (KoldMergeScan opens cold). Survival + plan proof, not TPC cert.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1" # weekly Monday 05:00 UTC (after benchmarks)

env:
  CARGO_TERM_COLOR: always
  PGRX_VERSION: "0.19.1"
  PG_VER: "16"
  KOLDSTORE_HAMMERDB_MINUTES: "2"
  KOLDSTORE_HAMMERDB_WAREHOUSES: "2"
  KOLDSTORE_HAMMERDB_VU: "2"

jobs:
  hammerdb:
    name: HammerDB TPROC-C (HISTORY manage + hot/cold proof)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KOLDSTORE_E2E_PGVERSION: "16"
      KOLDSTORE_E2E_PGPORT: "28816"
      KOLDSTORE_E2E_PGHOST: 127.0.0.1
      KOLDSTORE_E2E_PGDATABASE: koldstore_pgrx_e2e
      KOLDSTORE_E2E_WAIT_FOR_STARTUP: "1"
      PGRX_PG_CONFIG: /usr/lib/postgresql/16/bin/pg_config
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2

      - name: Install PostgreSQL 16 development packages
        run: |
          bash scripts/ci/install-pgdg-dev.sh 16

      - name: Install cargo-pgrx
        run: cargo install cargo-pgrx --version ${PGRX_VERSION} --locked

      - name: Initialize pgrx for PostgreSQL 16
        run: cargo pgrx init --pg16 "${PGRX_PG_CONFIG}"

      - name: Install HammerDB
        id: hammerdb
        run: |
          BIN="$(bash scripts/ci/install-hammerdb.sh | tail -n 1)"
          echo "bin=${BIN}" >> "$GITHUB_OUTPUT"

      - name: Run HammerDB stress + post-run hot/cold proof
        env:
          HAMMERDB_BIN: ${{ steps.hammerdb.outputs.bin }}
          KOLDSTORE_PGRX_INSTALL_SUDO: "1"
          KOLDSTORE_HAMMERDB_READ_ITERS: "50"
        run: bash scripts/readiness/run-hammerdb.sh 16

      - name: Upload HammerDB logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hammerdb-logs
          path: |
            target/hammerdb/hammerdb.log
            target/hammerdb/flush.log
            target/hammerdb/explain_post_run.txt
            target/hammerdb/reads_post_run.json
            target/hammerdb/summary.json
          if-no-files-found: warn
